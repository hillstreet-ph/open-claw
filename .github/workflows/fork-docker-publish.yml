# Fork-specific Docker Hub publish for hillstreet-ph/open-claw.
# The upstream docker-release.yml is gated to openclaw/openclaw and to sealed
# release payloads, so this fork builds its own immutable amd64 image here.
# Contract: DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repository secrets.
name: Fork Docker Publish

on:
  workflow_dispatch:
    inputs:
      extensions:
        description: Optional OPENCLAW_EXTENSIONS build arg (space/comma-separated plugin ids)
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: docker.io
  IMAGE_NAME: hillstreet/open-claw

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free runner disk for the monorepo build
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Resolve immutable image tags
        id: tags
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          suffix="$(date -u +%Y%m%d)"
          short_sha="${GITHUB_SHA:0:12}"
          {
            echo "version=${version}"
            echo "sha_tag=sha-${short_sha}"
            echo "release_tag=${version}-r${suffix}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validate Docker Hub publish credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "Docker Hub publishing requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets." >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push amd64 image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.release_tag }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            OPENCLAW_EXTENSIONS=${{ inputs.extensions }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Record published digest
        run: |
          set -euo pipefail
          {
            echo "## Published image"
            echo "- Repository: ${REGISTRY}/${IMAGE_NAME}"
            echo "- SHA tag: ${{ steps.tags.outputs.sha_tag }}"
            echo "- Release tag: ${{ steps.tags.outputs.release_tag }}"
            echo "- Digest: ${{ steps.build.outputs.digest }}"
            echo "- Git commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest=${{ steps.build.outputs.digest }}"