name: Sync upstream and release

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream openclaw/openclaw
        run: |
          git config user.name "openclaw-sync-bot"
          git config user.email "bot@hillstreet.ph"
          git remote add upstream https://github.com/openclaw/openclaw.git
          git fetch upstream main
          if git merge -X ours --no-edit upstream/main; then
            git push origin main
          else
            git merge --abort
            echo "Merge conflict; sync skipped this run."
          fi

      - name: Tag and release
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="v$VER-$(date -u +%Y%m%d)"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping release."
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          {
            echo "## Automated upstream sync release"
            echo ""
            echo "- Version: $VER"
            echo "- Upstream: openclaw/openclaw@main"
            echo "- Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Deploy: Zeabur auto-deploys main on push."
          } > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
