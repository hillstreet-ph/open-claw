name: Sync upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.repository == 'hillstreet-ph/open-claw'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync from upstream
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "open-claw-bot"
          git config user.email "bot@hillstreet-ph"
          git remote add upstream https://github.com/openclaw/openclaw.git
          git fetch upstream main
          git checkout main
          if git merge --no-edit upstream/main; then
            git push origin main
          else
            BRANCH="chore/upstream-sync-$(date -u +%Y%m%d)"
            git checkout -b "$BRANCH" || true
            git push origin "$BRANCH" || true
            gh pr create --base main --head "$BRANCH" \
              --title "Upstream sync $(date -u +%Y-%m-%d)" \
              --body "Automated merge from openclaw/openclaw main. Resolve conflicts and merge; Zeabur deploys automatically on merge." || true
          fi
