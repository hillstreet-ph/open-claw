# Fork release automation for hillstreet-ph/open-claw.
#
# On every push to main this workflow:
#   1. bumps the patch version in package.json (skipped when the commit is the
#      version bump itself, or carries [skip release]),
#   2. creates an annotated tag `vX.Y.Z` whose message carries the summary and
#      the details block,
#   3. publishes a GitHub Release with the same summary + details,
#   4. builds and pushes the Docker Hub image (reuses fork-docker-publish.yml),
#   5. asks Zeabur to redeploy the open-claw service so the new image goes live.
#
# Required repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, ZEABUR_TOKEN.
# No secret value is ever written into this file.
name: Fork Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply
        required: false
        default: patch
        type: choice
        options: [patch, minor, major, none]

permissions:
  contents: write

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ZEABUR_SERVICE_ID: 6aef4825dede4920ffc64943
  ZEABUR_ENVIRONMENT_ID: 6aef3380617188b6dd50f0c3

jobs:
  # Gate: never release a tree that fails validation. fork-validate.yml is the
  # single source of truth for "is this shippable" (workflow YAML parses,
  # openclaw.json has one publicOrigin and no wildcard origins, package.json is
  # valid semver). Reusing it here means the release cannot drift from the gate.
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.event.head_commit.message, '[skip release]') &&
       !startsWith(github.event.head_commit.message, 'chore(release):'))
    uses: ./.github/workflows/fork-validate.yml

  version:
    needs: validate
    # Never re-run on our own version-bump commit.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.event.head_commit.message, '[skip release]') &&
       !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      released: ${{ steps.bump.outputs.released }}
      # The commit that actually carries the release. The publish job must build
      # THIS, not github.sha: the bump commit is created inside this job, so
      # github.sha is always one version behind the tag.
      # Written by the `Commit, tag and push` step (id: publish_commit), which is
      # the only place that knows the commit that actually landed. Referencing
      # steps.bump here silently fell back to the pre-bump GITHUB_SHA placeholder,
      # so publish built the previous tree and tagged it with the new version.
      sha: ${{ steps.publish_commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          set -euo pipefail
          git config user.name "open-claw release bot"
          git config user.email "release-bot@users.noreply.github.com"

      - name: Resolve next version
        id: bump
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          current="$(node -p "require('./package.json').version")"
          # NOTE: never pipe git into `head` under `set -o pipefail` — git dies of
          # SIGPIPE (exit 141) once head closes the pipe. Use --count instead.
          last_tag="$(git for-each-ref --sort=-v:refname --count=1 \
            --format='%(refname:short)' 'refs/tags/v*' || true)"

          if [[ -z "${last_tag}" ]]; then
            # First automated release: publish the version already in package.json.
            next="${current}"
          elif [[ "${BUMP}" == "none" ]]; then
            next="${current}"
          else
            # Strip any pre-release/build suffix (e.g. the -20261113044514 that
            # an older timestamping pipeline appended) before splitting, and
            # drop a non-numeric patch part. Without this, "2026.11.5-2026111…"
            # lands in $patch and shifts the number backwards, producing tags
            # like v2026.11.-20261113044508.
            base="${last_tag#v}"
            base="${base%%-*}"
            IFS='.' read -r major minor patch <<< "${base}"
            [[ "${major}" =~ ^[0-9]+$ ]] || major=0
            [[ "${minor}" =~ ^[0-9]+$ ]] || minor=0
            [[ "${patch}" =~ ^[0-9]+$ ]] || patch=0
            case "${BUMP}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            next="${major}.${minor}.${patch}"
          fi

          tag="v${next}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${tag} already exists; nothing to release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag} (previous tag: ${last_tag:-none})" >> "$GITHUB_STEP_SUMMARY"

      - name: Build release notes
        if: steps.bump.outputs.released == 'true'
        id: notes
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          last_tag="$(git for-each-ref --sort=-v:refname --count=1 \
            --format='%(refname:short)' 'refs/tags/v*' || true)"
          range="${last_tag:+${last_tag}..HEAD}"
          range="${range:-HEAD}"

          # Summary: one line, the headline of this release.
          # `-1` instead of `| head -1`: piping git into head raises SIGPIPE (141)
          # under pipefail and fails the step.
          summary="$(git log ${range} --no-merges --pretty=%s -1)"
          summary="${summary:-Release ${TAG}}"

          # Details: grouped commit list plus build metadata.
          {
            echo "### Changes"
            echo
            git log ${range} --no-merges --pretty='- %s (`%h`)' -60
            echo
            echo "### Build"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`docker.io/hillstreet/open-claw:${VERSION}\`"
            echo "- Gateway: https://open-claw.zeabur.app"
          } > /tmp/details.md

          {
            echo "summary<<__SUMMARY_EOF__"
            echo "${summary}"
            echo "__SUMMARY_EOF__"
            echo "details<<__DETAILS_EOF__"
            cat /tmp/details.md
            echo "__DETAILS_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Bump package.json version
        if: steps.bump.outputs.released == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.version = process.env.VERSION;
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '
          git diff --stat

      - name: Commit, tag and push
        id: publish_commit
        if: steps.bump.outputs.released == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
          SUMMARY: ${{ steps.notes.outputs.summary }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # checkout runs with persist-credentials:false, so no credential is in
          # .git/config — install the token as an extraheader or `git push` (and
          # `--follow-tags`) has nothing to authenticate with.
          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          echo "::add-mask::${auth_header}"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth_header}"
          git add package.json
          # package.json can already carry the target version (first automated
          # release reuses the version in the file, and a `none` bump is a
          # no-op). `git commit` exits 1 on an empty index, which would fail the
          # step, so commit only when the bump actually changed something.
          if git diff --cached --quiet; then
            echo "package.json already at ${VERSION}; tagging without a bump commit."
          else
            git commit -m "chore(release): ${TAG} [skip release]" -m "${SUMMARY}"
          fi
          # Annotated tag carries the summary and the details block.
          {
            echo "${SUMMARY}"
            echo
            cat /tmp/details.md
          } > /tmp/tagmsg.txt
          # main can move between checkout and push (a PR merge, another
          # workflow). A bare push is then rejected with "fetch first" and the
          # whole release fails. Rebase the bump commit onto the current tip and
          # retry a few times before giving up. The tag is (re)created AFTER the
          # rebase so it always points at the commit that actually lands.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin "${GITHUB_REF_NAME}"
            if git rebase --quiet "origin/${GITHUB_REF_NAME}"; then
              git tag -d "${TAG}" >/dev/null 2>&1 || true
              git tag -a "${TAG}" -F /tmp/tagmsg.txt
              if git push origin "HEAD:${GITHUB_REF_NAME}" --follow-tags; then
                echo "Pushed ${TAG} on attempt ${attempt}."
                # Publish the commit that actually landed so the image is built
                # from the released tree, not the pre-bump triggering SHA.
                echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Push attempt ${attempt} lost the race; retrying in $((attempt * 3))s."
            sleep $((attempt * 3))
          done
          echo "::error::Could not push ${TAG} after 5 attempts; main kept moving."
          exit 1

      - name: Publish GitHub Release
        if: steps.bump.outputs.released == 'true'
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          SUMMARY: ${{ steps.notes.outputs.summary }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "${SUMMARY}"
            echo
            cat /tmp/details.md
          } > /tmp/release-body.md
          gh release create "${TAG}" \
            --title "${TAG} — ${SUMMARY}" \
            --notes-file /tmp/release-body.md \
            --latest

  publish:
    needs: version
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/fork-docker-publish.yml
    with:
      extensions: ""
      # Build the released commit, not github.sha (which predates the bump).
      ref: ${{ needs.version.outputs.sha }}
      version: ${{ needs.version.outputs.version }}
    # Pass only what the reusable workflow declares — `secrets: inherit` hands
    # every parent secret to the callee and is flagged by zizmor
    # (secrets-inherit, medium) in the Workflow Sanity audit.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  deploy:
    needs: [version, publish]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Redeploy the Zeabur service
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${ZEABUR_TOKEN}" ]]; then
            echo "::error::ZEABUR_TOKEN secret is not set; cannot trigger the Zeabur redeploy."
            exit 1
          fi
          # Build the GraphQL body with printf, not nested shell escaping — a
          # single mis-escaped quote silently sends invalid JSON. Kept on one
          # line so the YAML block scalar stays valid.
          printf '{"query":"mutation { redeployService(serviceID: \\"%s\\", environmentID: \\"%s\\") }"}' \
            "${ZEABUR_SERVICE_ID}" "${ZEABUR_ENVIRONMENT_ID}" > /tmp/zeabur.json
          python3 -c "import json;json.load(open('/tmp/zeabur.json'))"  # fail fast if malformed
          response="$(curl -sS --max-time 60 -X POST https://api.zeabur.com/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ZEABUR_TOKEN}" \
            --data-binary "@/tmp/zeabur.json")"
          echo "${response}"
          if echo "${response}" | grep -q '"errors"'; then
            echo "::error::Zeabur redeploy failed."
            exit 1
          fi
          {
            echo "## Deployed ${TAG}"
            echo "- Zeabur service: \`${ZEABUR_SERVICE_ID}\`"
            echo "- Environment: \`${ZEABUR_ENVIRONMENT_ID}\`"
            echo "- Gateway: https://open-claw.zeabur.app"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the gateway is healthy after deploy
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Zeabur rolls the pod asynchronously, so poll rather than sampling
          # once. A deploy that returns true but never becomes healthy is the
          # failure this step exists to catch.
          url="https://open-claw.zeabur.app/health"
          for attempt in $(seq 1 30); do
            body="$(curl -sS --max-time 10 "${url}" || true)"
            if echo "${body}" | grep -q '"ok":true'; then
              echo "Healthy after ${attempt} attempt(s): ${body}"
              echo "- Health: \`${body}\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt ${attempt}/30: ${body:-<no response>}"
            sleep 10
          done
          echo "::error::Gateway did not report healthy within 5 minutes of deploy."
          exit 1

      - name: Self-heal — retry the redeploy once on failure
        if: failure()
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
        run: |
          set -euo pipefail
          # One automatic retry: a Zeabur redeploy can fail transiently while a
          # previous rollout is still settling. If the retry also fails the job
          # stays red and a human looks at it — we never loop.
          echo "::warning::Deploy verification failed; retrying the Zeabur redeploy once."
          printf '{"query":"mutation { redeployService(serviceID: \\"%s\\", environmentID: \\"%s\\") }"}' \
            "${ZEABUR_SERVICE_ID}" "${ZEABUR_ENVIRONMENT_ID}" > /tmp/zeabur-retry.json
          python3 -c "import json;json.load(open('/tmp/zeabur-retry.json'))"
          curl -sS --max-time 60 -X POST https://api.zeabur.com/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ZEABUR_TOKEN}" \
            --data-binary "@/tmp/zeabur-retry.json" || true
          sleep 45
          curl -sS --max-time 10 https://open-claw.zeabur.app/health || true
